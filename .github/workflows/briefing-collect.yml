name: Collect Briefing Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/briefing-collect.yml'
      - 'codex-briefing-system/src/collect-candidates.mjs'
      - 'data/briefing-sources.json'
  schedule:
    - cron: '45 23 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: briefing-source-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect candidates without publishing an edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: node codex-briefing-system/src/collect-candidates.mjs
      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-source-collection
          path: data/briefing-candidates.json
      - name: Update source desk snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/briefing-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update news source collection"
          git pull --rebase origin main
          git push origin HEAD:main
          # Let an edition deployment finish so its Briefing title reaches mail handoff.
          for run_id in $(gh run list --workflow deploy-pages.yml --limit 10 --json databaseId,status --jq ' .[] | select(.status != "completed") | .databaseId'); do
            gh run watch "$run_id" || true
          done
          gh workflow run deploy-pages.yml --ref main
