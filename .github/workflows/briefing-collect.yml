name: Collect Briefing Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/briefing-collect.yml'
      - 'codex-briefing-system/src/collect-candidates.mjs'
      - 'data/briefing-sources.json'
  schedule:
    - cron: '45 23 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing-source-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codex-briefing-system/src/
            /data/briefing-sources.json
            /data/briefing-candidates.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect candidates without publishing an edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: node codex-briefing-system/src/collect-candidates.mjs
      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-source-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/briefing-candidates.json
      - name: Update source desk snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/briefing-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update news source collection"
          git pull --rebase origin main
          git push origin HEAD:main
          # The news desk reads this public snapshot directly; no full-site deployment.
