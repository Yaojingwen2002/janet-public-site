name: Daily Janet News

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-janet-news
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate daily news
        run: node .github/scripts/daily-news-generator.mjs

      - name: QA generated news
        run: node .github/scripts/qa-daily-news-output.mjs

      - name: Commit generated news files
        run: |
          git config user.name "janet-news-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Daily Janet news update"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
