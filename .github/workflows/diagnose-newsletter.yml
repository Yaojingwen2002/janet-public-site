name: Diagnose Newsletter State

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Supabase newsletter state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');

          const supabaseUrl = String(process.env.SUPABASE_URL || '').replace(/\/+$/, '');
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!supabaseUrl || !serviceRoleKey) throw new Error('Missing Supabase secrets');

          function normalizeEmail(value) {
            return String(value || '').trim().toLowerCase();
          }

          function validEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
          }

          function boolValue(value) {
            if (value === true || value === false) return value;
            if (typeof value === 'string') {
              if (/^true$/i.test(value)) return true;
              if (/^false$/i.test(value)) return false;
            }
            return null;
          }

          function maskEmail(email) {
            const [name, domain] = String(email || '').split('@');
            if (!name || !domain) return '[invalid-email]';
            return `${name.slice(0, 3)}***@${domain}`;
          }

          function hashEmail(email) {
            return crypto.createHash('sha256').update(email).digest('hex').slice(0, 12);
          }

          async function rest(path, options = {}) {
            const res = await fetch(`${supabaseUrl}/rest/v1/${path}`, {
              ...options,
              headers: {
                apikey: serviceRoleKey,
                Authorization: `Bearer ${serviceRoleKey}`,
                'Content-Type': 'application/json',
                Accept: 'application/json',
                Prefer: 'count=exact',
                ...(options.headers || {})
              }
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`REST ${res.status}: ${text.slice(0, 500)}`);
            return text ? JSON.parse(text) : [];
          }

          async function auth(path) {
            const res = await fetch(`${supabaseUrl}/auth/v1/${path}`, {
              headers: {
                apikey: serviceRoleKey,
                Authorization: `Bearer ${serviceRoleKey}`,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              }
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`AUTH ${res.status}: ${text.slice(0, 500)}`);
            return text ? JSON.parse(text) : {};
          }

          async function listAuthUsers() {
            const users = [];
            const perPage = 1000;
            for (let page = 1; page < 1000; page += 1) {
              const data = await auth(`admin/users?page=${page}&per_page=${perPage}`);
              const batch = Array.isArray(data.users) ? data.users : [];
              users.push(...batch);
              if (batch.length < perPage) break;
            }
            return users;
          }

          (async () => {
            const [subscribers, profiles, authUsers] = await Promise.all([
              rest('newsletter_subscribers?select=email,display_name,last_sent_at,subscribed&email=not.is.null'),
              rest('profiles?select=email,display_name,username,newsletter_opt_in,is_guest&email=not.is.null'),
              listAuthUsers()
            ]);

            const authEmailUsers = authUsers
              .map((user) => ({ email: normalizeEmail(user.email), meta: user.user_metadata || {} }))
              .filter((user) => validEmail(user.email));
            const formalProfiles = profiles
              .map((row) => ({ ...row, email: normalizeEmail(row.email) }))
              .filter((row) => validEmail(row.email) && row.is_guest !== true);
            const subscribedRows = subscribers
              .map((row) => ({ ...row, email: normalizeEmail(row.email) }))
              .filter((row) => validEmail(row.email) && row.subscribed === true);

            const byEmail = new Map();
            const optedOut = new Set();
            const lastSentByEmail = new Map();

            for (const row of subscribers) {
              const email = normalizeEmail(row.email);
              if (!validEmail(email)) continue;
              if (row.last_sent_at) lastSentByEmail.set(email, row.last_sent_at);
              if (row.subscribed === false) {
                optedOut.add(email);
                continue;
              }
              byEmail.set(email, {
                email,
                source: 'newsletter_subscribers',
                lastSentAt: row.last_sent_at || ''
              });
            }

            for (const user of authUsers) {
              const email = normalizeEmail(user.email);
              if (!validEmail(email)) continue;
              const optIn = boolValue((user.user_metadata || {}).newsletter_opt_in);
              if (optIn === false) {
                optedOut.add(email);
                byEmail.delete(email);
                continue;
              }
              if (optedOut.has(email) || byEmail.has(email)) continue;
              byEmail.set(email, {
                email,
                source: 'auth.users',
                lastSentAt: lastSentByEmail.get(email) || ''
              });
            }

            for (const row of profiles) {
              const email = normalizeEmail(row.email);
              if (!validEmail(email) || row.is_guest === true || optedOut.has(email) || byEmail.has(email)) continue;
              byEmail.set(email, {
                email,
                source: 'profiles',
                lastSentAt: lastSentByEmail.get(email) || ''
              });
            }

            const recipients = Array.from(byEmail.values()).sort((a, b) => a.email.localeCompare(b.email));
            const maskGroups = recipients.reduce((acc, item) => {
              const key = maskEmail(item.email);
              acc[key] = (acc[key] || 0) + 1;
              return acc;
            }, {});

            console.log(`auth_email_users=${authEmailUsers.length}`);
            console.log(`formal_profiles_with_email=${formalProfiles.length}`);
            console.log(`newsletter_subscribed_rows=${subscribedRows.length}`);
            console.log(`final_daily_recipients=${recipients.length}`);
            console.log('mask_groups=' + JSON.stringify(maskGroups));
            for (const item of recipients) {
              console.log(`recipient mask=${maskEmail(item.email)} hash=${hashEmail(item.email)} source=${item.source} last_sent_at=${item.lastSentAt || ''}`);
            }
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE
