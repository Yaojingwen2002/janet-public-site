name: News Store Harvest

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */2 * * *"
    - cron: "30 11 * * *" # TEMP-U13-B-FIX3 one-shot test, remove after first run

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harvest news items
        run: node .github/scripts/harvest-news-items.mjs

      - name: Build daily candidates
        run: node .github/scripts/build-daily-candidates.mjs

      - name: QA news store
        run: node scripts/qa-news-store.mjs

      - name: Commit news store update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-store
          if git diff --cached --quiet; then
            echo "No news store changes"
          else
            git commit -m "Update news store"
            git push
          fi
