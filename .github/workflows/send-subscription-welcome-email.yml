name: Send Subscription Welcome Email

on:
  workflow_dispatch:
    inputs:
      recipient_email:
        description: Optional single recipient email for manual sends.
        required: false
        type: string
      dry_run:
        description: Check recipients without sending email.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: subscription-welcome-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mail dependency
        run: npm install --no-save nodemailer@^6.9.16

      - name: Send subscription welcome email
        run: node .github/scripts/send-subscription-welcome-email.mjs
        env:
          PUBLIC_SITE_URL: https://yaojingwen2002.github.io/janet-public-site/
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
