<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="../assets/icons/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css?v=button-aura-20260617">
  <link rel="stylesheet" href="../styles/potato-center.css">
</head>
<body>
  <div class="potato-center" data-potato-center>
    <button class="potato-half potato-user-trigger" type="button" aria-label="打开个人中心" aria-expanded="false" data-potato-user-trigger>
      <span class="potato-user-label" data-potato-user-label data-loading="true">登</span>
    </button>
    <button class="potato-half potato-menu-trigger" type="button" aria-label="打开站点菜单" aria-expanded="false" aria-controls="mobile-nav-menu" data-potato-menu-trigger>
      <span class="potato-menu-icon">☰</span>
    </button>
  </div>
  <div class="mobile-nav-menu" id="mobile-nav-menu">
    <a href="../index.html">首页</a>
    <a href="../news.html">Janet 快车箱</a>
    <a href="../portfolio.html">作品库</a>
    <a href="../gpt-image2-handbook.html">iGPT-Image2 手册</a>
    <a href="../shuttle-universe.html">穿梭宇宙</a>
    <a href="../misaligned-scenes.html">错位名场面</a>
    <a href="../index.html#about">关于 Janet</a>
    <a href="../index.html#contact">联系</a>
  </div>

  <main class="not-found-main">
    <section class="not-found-panel" id="reset-state">
      <span class="not-found-kicker">Password Reset</span>
      <h1>重置密码</h1>
      <p id="reset-copy">正在确认重置链接。</p>
      <form class="potato-form" id="reset-form" hidden>
        <label class="potato-field">
          <span>新密码</span>
          <input type="password" id="reset-password" autocomplete="new-password" minlength="6" required>
        </label>
        <label class="potato-field">
          <span>确认新密码</span>
          <input type="password" id="reset-password-confirm" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="potato-btn" type="submit">更新密码</button>
      </form>
      <p class="potato-error" id="reset-error" hidden></p>
      <div class="not-found-actions">
        <a href="../index.html">返回首页</a>
        <a href="../news.html">看晨报归档</a>
      </div>
    </section>
  </main>

  <script src="../scripts/supabase-config.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/potato-center.js"></script>
  <script src="../scripts/nav.js"></script>
  <script>
    (function() {
      'use strict';
      let recovered = false;
      let expiredTimer = null;
      const copy = document.getElementById('reset-copy');
      const form = document.getElementById('reset-form');
      const errorEl = document.getElementById('reset-error');

      function showResetForm() {
        recovered = true;
        copy.textContent = '输入新密码，6 位以上。';
        form.hidden = false;
        errorEl.hidden = true;
      }

      function showExpired() {
        copy.textContent = '重置链接已失效，请回土豆中心重新申请密码重置邮件。';
        form.hidden = true;
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
      }

      async function boot() {
        if (window.JanetSupabase && window.JanetSupabase.ready) await window.JanetSupabase.ready;
        const client = window.JanetSupabase && window.JanetSupabase.client;
        if (!client) {
          showExpired();
          return;
        }

        client.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
            recovered = true;
            if (expiredTimer) clearTimeout(expiredTimer);
            showResetForm();
          }
        });

        const { data: { session } } = await client.auth.getSession();
        if (session) showResetForm();

        expiredTimer = setTimeout(() => {
          if (!recovered) showExpired();
        }, 3000);

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.getElementById('reset-password').value;
          const confirm = document.getElementById('reset-password-confirm').value;
          if (password !== confirm) {
            showError('两次密码不一致');
            return;
          }
          const { error } = await client.auth.updateUser({ password });
          if (!error) {
            copy.textContent = '密码已重置，正在返回首页。';
            form.hidden = true;
            setTimeout(() => { location.href = '../index.html'; }, 1500);
          } else {
            showError('重置失败，请重新申请密码重置邮件');
          }
        });
      }

      boot();
    })();
  </script>
</body>
</html>
