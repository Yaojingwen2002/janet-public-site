  <meta charset="UTF-8">

  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css?v=button-aura-20260617">
  <link rel="stylesheet" href="../styles/potato-center.css?v=potato-roll-20260617">
  <link rel="stylesheet" href="../styles/signal-cursor.css?v=experiment-wave-16">
  <link rel="stylesheet" href="../styles/experiment-pages.css?v=experiment-wave-16">
</head>
<body>
  <div class="potato-center" data-potato-center>
    <button class="potato-half potato-user-trigger" type="button" aria-label="打开个人中心" aria-expanded="false" data-potato-user-trigger>
      <span class="potato-user-label" data-potato-user-label data-loading="true">登</span>
    </button>
    <button class="potato-half potato-menu-trigger" type="button" aria-label="打开站点菜单" aria-expanded="false" aria-controls="mobile-nav-menu" data-potato-menu-trigger>
      <span class="potato-menu-icon">☰</span>
    </button>
  </div>
  <div class="mobile-nav-menu" id="mobile-nav-menu">
    <a href="../index.html">首页</a>
    <a href="../news.html">Janet 快车箱</a>
    <a href="../portfolio.html">作品库</a>
    <a href="../index.html#about">关于 Janet</a>
    <a href="../index.html#contact">联系</a>
  </div>

  <main class="not-found-main">
    <section class="not-found-panel" id="reset-state">
      <span class="not-found-kicker">Password Reset</span>
      <h1>重置密码</h1>
      <p id="reset-copy">正在确认重置链接。</p>
      <form class="potato-form" id="reset-form" hidden>
        <label class="potato-field">
          <span>新密码</span>
          <input type="password" id="reset-password" autocomplete="new-password" minlength="6" required>
        </label>
        <label class="potato-field">
          <span>确认新密码</span>
          <input type="password" id="reset-password-confirm" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="potato-btn" type="submit">更新密码</button>
      </form>
      <p class="potato-error" id="reset-error" hidden></p>
      <div class="not-found-actions">
        <a href="../index.html">返回首页</a>
        <a href="../news.html">看晨报归档</a>
      </div>
    </section>
  </main>

  <script src="../scripts/supabase-config.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/potato-center.js?v=potato-roll-20260617"></script>
  <script src="../scripts/nav.js?v=potato-roll-20260617"></script>
  <script src="../scripts/signal-cursor.js?v=experiment-wave-16"></script>
  <script>
    (function() {
      'use strict';
      let recovered = false;
      let expiredTimer = null;
      const copy = document.getElementById('reset-copy');
      const form = document.getElementById('reset-form');
      const errorEl = document.getElementById('reset-error');

      function showResetForm() {
        recovered = true;
        copy.textContent = '输入新密码，6 位以上。';
        form.hidden = false;
        errorEl.hidden = true;
      }

      function showExpired(message) {
        copy.textContent = message || '重置链接已失效，请回土豆中心重新申请密码重置邮件。';
        form.hidden = true;
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
      }

      function getRecoveryParams() {
        const search = new URLSearchParams(location.search);
        const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
        return {
          code: search.get('code') || hash.get('code') || '',
          accessToken: search.get('access_token') || hash.get('access_token') || '',
          refreshToken: search.get('refresh_token') || hash.get('refresh_token') || '',
          type: search.get('type') || hash.get('type') || '',
          error: search.get('error_description') || hash.get('error_description') || search.get('error') || hash.get('error') || ''
        };
      }

      function cleanRecoveryUrl() {
        if (!history.replaceState) return;
        history.replaceState({}, document.title, location.pathname);
      }

      async function activateRecoverySession(client) {
        const params = getRecoveryParams();
        if (params.error) throw new Error(params.error);

        if (params.code) {
          const { error } = await client.auth.exchangeCodeForSession(params.code);
          if (error) throw error;
          cleanRecoveryUrl();
          return true;
        }

        if (params.accessToken && params.refreshToken) {
          const { error } = await client.auth.setSession({
            access_token: params.accessToken,
            refresh_token: params.refreshToken
          });
          if (error) throw error;
          cleanRecoveryUrl();
          return true;
        }

        return false;
      }

      async function boot() {
        if (window.JanetSupabase && window.JanetSupabase.ready) await window.JanetSupabase.ready;
        const client = window.JanetSupabase && window.JanetSupabase.client;
        if (!client) {
          showExpired('登录服务暂时不可用。请确认 Supabase 项目已恢复后，再重新申请密码重置邮件。');
          return;
        }

        client.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
            recovered = true;
            if (expiredTimer) clearTimeout(expiredTimer);
            showResetForm();
          }
        });

        try {
          await activateRecoverySession(client);
          const { data: { session }, error } = await client.auth.getSession();
          if (error) throw error;
          if (session) showResetForm();
        } catch (error) {
          const message = String(error && error.message ? error.message : error || '');
          showExpired(/expired|invalid|otp|token/i.test(message)
            ? '重置链接已失效，请回土豆中心重新申请密码重置邮件。'
            : '登录服务暂时不可用或链接校验失败。请稍后重试，或重新申请密码重置邮件。');
          showError(message || '重置链接校验失败');
          return;
        }

        expiredTimer = setTimeout(() => {
          if (!recovered) showExpired('没有检测到有效的重置登录态。请从最新一封重置邮件重新打开链接。');
        }, 6000);

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.getElementById('reset-password').value;
          const confirm = document.getElementById('reset-password-confirm').value;
          if (password !== confirm) {
            showError('两次密码不一致');
            return;
          }
          const { error } = await client.auth.updateUser({ password });
          if (!error) {
            copy.textContent = '密码已重置，正在返回首页。';
            form.hidden = true;
            setTimeout(() => { location.href = '../index.html'; }, 1500);
          } else {
            showError(error.message || '重置失败，请重新申请密码重置邮件');
          }
        });
      }

      boot().catch((error) => {
        showExpired('登录服务暂时不可用。请确认 Supabase 项目已恢复后，再重新申请密码重置邮件。');
        showError(error && error.message ? error.message : '重置页启动失败');
      });
    })();
  </script>
</body>
</html>
